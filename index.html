<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 精彩演唱會 - 報名與掃碼簽到系統</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a; color: #f8fafc;
      display: flex; justify-content: center; align-items: flex-start;
      min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
    }
    .card {
      background: #1e293b; padding: 1.8rem; border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 460px;
      transition: max-width 0.3s ease;
    }
    .card.admin-wide { max-width: 820px; }
    h2 { color: #38bdf8; text-align: center; margin-top: 0; }
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 1.2rem; }
    .tab-btn {
      flex: 1; padding: 0.6rem; background: #0f172a; border: 1px solid #334155;
      color: #94a3b8; border-radius: 8px; cursor: pointer; font-weight: bold;
    }
    .tab-btn.active { background: #0284c7; color: #fff; border-color: #0284c7; }
    .status-badge {
      background: #0f172a; border: 1px solid #334155; padding: 10px;
      border-radius: 8px; text-align: center; margin-bottom: 1rem; font-size: 0.9rem;
    }
    .status-badge span { color: #f59e0b; font-weight: bold; }
    .form-group { margin-bottom: 1.1rem; }
    label { display: block; margin-bottom: 0.4rem; font-size: 0.88rem; color: #94a3b8; }
    input {
      width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #334155;
      background: #0f172a; color: #fff; box-sizing: border-box; font-size: 1rem;
    }
    button.submit-btn {
      width: 100%; padding: 0.85rem; border: none; border-radius: 8px;
      background: #0284c7; color: white; font-size: 1rem; font-weight: bold; cursor: pointer;
    }
    button.submit-btn:disabled { background: #475569; cursor: not-allowed; }
    .green-btn { background: #10b981 !important; margin-top: 10px; }
    .cancel-btn { background: #ef4444 !important; margin-top: 10px; }
    .result-box {
      margin-top: 1rem; padding: 1rem; border-radius: 8px;
      text-align: center; display: none; font-weight: bold;
    }
    .res-success { background: #064e3b; color: #34d399; border: 1px solid #059669; }
    .res-warning { background: #78350f; color: #fbbf24; border: 1px solid #d97706; }
    .res-error { background: #7f1d1d; color: #f87171; border: 1px solid #dc2626; }
    .admin-footer { margin-top: 1.5rem; text-align: center; border-top: 1px solid #334155; padding-top: 1rem; }
    .admin-link { color: #64748b; font-size: 0.85rem; cursor: pointer; }
    #reader { width: 100%; max-width: 360px; margin: 0 auto 15px auto; border-radius: 8px; overflow: hidden; background: #000; }

    /* 儀表板與名單樣式 */
    .dashboard-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.2rem;
    }
    .stat-card {
      background: #0f172a; border: 1px solid #334155; padding: 12px 8px;
      border-radius: 10px; text-align: center;
    }
    .stat-label { font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
    .stat-num { font-size: 1.5rem; font-weight: bold; }
    .table-wrapper {
      overflow-x: auto; background: #0f172a; border-radius: 10px;
      border: 1px solid #334155; max-height: 360px; overflow-y: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left; }
    th {
      background: #1e293b; color: #94a3b8; padding: 10px; position: sticky; top: 0;
      border-bottom: 1px solid #334155; white-space: nowrap;
    }
    td { padding: 10px; border-bottom: 1px solid #1e293b; white-space: nowrap; }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
    .badge-ok { background: #064e3b; color: #34d399; }
    .badge-wait { background: #334155; color: #cbd5e1; }
    .badge-cancel { background: #7f1d1d; color: #f87171; }
    .mini-btn {
      padding: 4px 8px; border: none; border-radius: 5px; font-size: 0.75rem;
      cursor: pointer; font-weight: bold; color: #fff; margin-right: 4px;
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <h2>🎵 2026 精彩演唱會</h2>

    <div class="nav-tabs" id="userTabs">
      <button class="tab-btn active" id="tabReg" onclick="switchTab('reg')">線上報名</button>
      <button class="tab-btn" id="tabQuery" onclick="switchTab('query')">查詢／退票</button>
    </div>

    <!-- 線上報名 -->
    <div id="secReg">
      <div class="status-badge">門票總數：100 張 | 剩餘 <span id="remCount">讀取中...</span> 張</div>
      <form id="regForm">
        <div class="form-group"><label>姓名</label><input type="text" id="name" required></div>
        <div class="form-group"><label>電子郵件 (接收 QR Code 憑證)</label><input type="email" id="email" required></div>
        <div class="form-group"><label>聯絡電話</label><input type="tel" id="phone" required></div>
        <div class="form-group"><label>報名張數</label><input type="number" id="ticketCount" value="1" min="1" max="4" required></div>
        <button type="submit" class="submit-btn" id="regBtn">立即報名</button>
      </form>
    </div>

    <!-- 查詢/退票 -->
    <div id="secQuery" style="display: none;">
      <form id="queryForm">
        <div class="form-group"><label>輸入報名 Email 或序號 (如 TIX-001)</label><input type="text" id="queryInput" required></div>
        <button type="submit" class="submit-btn" id="queryBtn">查詢紀錄</button>
      </form>
      <div id="queryResult" style="margin-top:1rem; background:#0f172a; padding:1rem; border-radius:8px; display:none;"></div>
    </div>

    <!-- 工作人員管理後台 -->
    <div id="secAdmin" style="display: none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="color:#10b981; margin:0;">📊 工作人員管理後台</h3>
        <button type="button" onclick="loadAdminData()" style="background:#334155; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:0.85rem;">🔄 重新整理數據</button>
      </div>

      <!-- 即時統計儀表板 -->
      <div class="dashboard-grid">
        <div class="stat-card">
          <div class="stat-label">已報名張數</div>
          <div class="stat-num" id="statBooked" style="color:#38bdf8;">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">已簽到張數</div>
          <div class="stat-num" id="statChecked" style="color:#10b981;">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">剩餘名額</div>
          <div class="stat-num" id="statRem" style="color:#f59e0b;">-</div>
        </div>
      </div>

      <!-- 掃碼與手動簽到 -->
      <div id="reader"></div>
      <button type="button" class="submit-btn" id="camBtn" onclick="toggleCamera()" style="background:#f59e0b; color:#0f172a; margin-bottom:12px;">📷 開啟相機掃描 QR Code</button>

      <form id="manualCheckForm" style="display:flex; gap:8px; margin-bottom:12px;">
        <input type="text" id="manualCode" placeholder="輸入序號簽到 (如 TIX-001)" style="text-transform:uppercase; flex:1;">
        <button type="submit" class="submit-btn green-btn" style="width:auto; margin-top:0; padding:0 18px;">簽到</button>
      </form>

      <div class="result-box" id="checkResult" style="margin-bottom:15px;"></div>

      <!-- 完整報名名單列表 -->
      <div style="margin-top:18px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:10px;">
          <strong style="color:#cbd5e1;">📋 完整報名名單</strong>
          <input type="text" id="adminSearch" oninput="filterAdminList()" placeholder="搜尋姓名、Email 或序號..." style="max-width:220px; padding:6px 10px; font-size:0.85rem;">
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>序號</th>
                <th>姓名</th>
                <th>張數</th>
                <th>狀態</th>
                <th>操作</th>
                <th>Email / 電話</th>
              </tr>
            </thead>
            <tbody id="adminTableBody">
              <tr><td colspan="6" style="text-align:center; color:#94a3b8;">載入名單中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <button type="button" class="submit-btn cancel-btn" onclick="exitAdmin()" style="margin-top:20px;">退出管理後台</button>
    </div>

    <div class="admin-footer" id="adminFooter">
      <span class="admin-link" onclick="loginAdmin()">🔒 工作人員後台（儀表板／掃碼簽到／名單）</span>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz6zdSyNnMXLLTm6Mq-Am7FWpuah0cHqnkbbbO8HHH5KyjUj4P5mv5k02e1FqbiJAF3/exec";

    let html5QrCode = null;
    let isScanning = false;
    let allRegistrations = [];

    function callApi(params) {
      return new Promise((resolve, reject) => {
        const cbName = "gs_cb_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
        const query = Object.keys(params)
          .map(k => encodeURIComponent(k) + "=" + encodeURIComponent(params[k]))
          .join("&");
        
        const script = document.createElement("script");
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("連線逾時，請確認已登入學校 Google 帳號"));
        }, 12000);

        function cleanup() {
          clearTimeout(timer);
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[cbName] = function(data) {
          cleanup();
          resolve(data);
        };

        script.onerror = function() {
          cleanup();
          reject(new Error("連線失敗"));
        };

        script.src = `${API_URL}?${query}&callback=${cbName}`;
        document.body.appendChild(script);
      });
    }

    window.onload = function() {
      loadStatus();
    };

    function loadStatus() {
      document.getElementById("remCount").innerText = "讀取中...";
      callApi({ action: "status" })
        .then(data => {
          document.getElementById("remCount").innerText = data.remaining;
        })
        .catch(() => {
          document.getElementById("remCount").innerText = "連線失敗";
        });
    }

    function switchTab(tab) {
      document.getElementById("tabReg").className = tab === 'reg' ? 'tab-btn active' : 'tab-btn';
      document.getElementById("tabQuery").className = tab === 'query' ? 'tab-btn active' : 'tab-btn';
      document.getElementById("secReg").style.display = tab === 'reg' ? 'block' : 'none';
      document.getElementById("secQuery").style.display = tab === 'query' ? 'block' : 'none';
    }

    document.getElementById("regForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const btn = document.getElementById("regBtn");
      btn.disabled = true; btn.innerText = "報名處理中...";

      callApi({
        action: "register",
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        ticketCount: document.getElementById("ticketCount").value
      })
      .then(data => {
        btn.disabled = false; btn.innerText = "立即報名";
        if (data.status === "success") {
          alert(`🎉 報名成功！您的序號為：${data.ticketCode}\n專屬 QR Code 憑證已寄至您的 Email！`);
          document.getElementById("remCount").innerText = data.remaining;
          document.getElementById("regForm").reset();
        } else {
          alert("❌ 報名失敗：" + data.message);
        }
      })
      .catch(err => {
        btn.disabled = false; btn.innerText = "立即報名";
        alert("⚠️ " + err.message);
      });
    });

    document.getElementById("queryForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const q = document.getElementById("queryInput").value;
      const btn = document.getElementById("queryBtn");
      const box = document.getElementById("queryResult");
      btn.disabled = true; btn.innerText = "查詢中...";

      callApi({ action: "query", q: q })
        .then(data => {
          btn.disabled = false; btn.innerText = "查詢紀錄";
          box.style.display = "block";
          if (data.status === "success") {
            box.innerHTML = `
              <div style="color:#38bdf8; font-weight:bold; font-size:1.2rem;">序號：${data.ticketCode}</div>
              <div>持票人：${data.name}（${data.ticketCount} 張）</div>
              <div>狀態：<span style="color:#34d399;">${data.checkInStatus}</span></div>
              <button class="submit-btn cancel-btn" onclick="cancelTicket('${data.ticketCode}')">申請退票</button>
            `;
          } else {
            box.innerHTML = `<span style="color:#f87171;">${data.message}</span>`;
          }
        });
    });

    function cancelTicket(code, isAdmin = false) {
      if (!confirm(`確定要取消作廢序號 ${code} 嗎？`)) return;
      callApi({ action: "cancel", code: code })
        .then(data => {
          alert(data.message);
          if (isAdmin) {
            loadAdminData();
          } else {
            document.getElementById("queryResult").style.display = "none";
            loadStatus();
          }
        });
    }

    function loginAdmin() {
      if (prompt("請輸入工作人員密碼：") === "1234") {
        document.getElementById("mainCard").classList.add("admin-wide");
        document.getElementById("userTabs").style.display = "none";
        document.getElementById("secReg").style.display = "none";
        document.getElementById("secQuery").style.display = "none";
        document.getElementById("adminFooter").style.display = "none";
        document.getElementById("secAdmin").style.display = "block";
        loadAdminData();
      } else {
        alert("❌ 密碼錯誤");
      }
    }

    function exitAdmin() {
      if (isScanning && html5QrCode) {
        html5QrCode.stop().then(() => { isScanning = false; });
      }
      document.getElementById("mainCard").classList.remove("admin-wide");
      document.getElementById("secAdmin").style.display = "none";
      document.getElementById("userTabs").style.display = "flex";
      document.getElementById("adminFooter").style.display = "block";
      switchTab('reg');
      loadStatus();
    }

    function loadAdminData() {
      document.getElementById("adminTableBody").innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8;">更新數據中...</td></tr>`;
      callApi({ action: "admin_data" })
        .then(data => {
          if (data.status === "success") {
            document.getElementById("statBooked").innerText = data.stats.booked;
            document.getElementById("statChecked").innerText = data.stats.checkedIn;
            document.getElementById("statRem").innerText = data.stats.remaining;
            allRegistrations = data.list;
            renderAdminTable(allRegistrations);
          }
        })
        .catch(() => {
          document.getElementById("adminTableBody").innerHTML = `<tr><td colspan="6" style="text-align:center; color:#f87171;">載入失敗，請檢查連線</td></tr>`;
        });
    }

    function filterAdminList() {
      const kw = document.getElementById("adminSearch").value.trim().toUpperCase();
      if (!kw) {
        renderAdminTable(allRegistrations);
        return;
      }
      const filtered = allRegistrations.filter(item =>
        String(item.ticketCode).toUpperCase().includes(kw) ||
        String(item.name).toUpperCase().includes(kw) ||
        String(item.email).toUpperCase().includes(kw) ||
        String(item.phone).includes(kw)
      );
      renderAdminTable(filtered);
    }

    function renderAdminTable(list) {
      const tbody = document.getElementById("adminTableBody");
      if (!list || list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8;">目前尚無報名資料</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(row => {
        let badgeClass = "badge-wait";
        if (row.status === "已簽到") badgeClass = "badge-ok";
        else if (row.status === "已取消") badgeClass = "badge-cancel";

        let actions = "-";
        if (row.status === "未簽到") {
          actions = `
            <button class="mini-btn" style="background:#10b981;" onclick="executeCheckIn('${row.ticketCode}')">簽到</button>
            <button class="mini-btn" style="background:#ef4444;" onclick="cancelTicket('${row.ticketCode}', true)">取消</button>
          `;
        } else if (row.status === "已簽到") {
          actions = `<button class="mini-btn" style="background:#ef4444;" onclick="cancelTicket('${row.ticketCode}', true)">作廢</button>`;
        }

        return `
          <tr>
            <td style="font-weight:bold; color:#38bdf8;">${row.ticketCode}</td>
            <td>${row.name}</td>
            <td>${row.ticketCount} 張</td>
            <td><span class="badge ${badgeClass}">${row.status}</span></td>
            <td>${actions}</td>
            <td style="color:#94a3b8; font-size:0.8rem;">${row.email}<br>${row.phone}</td>
          </tr>
        `;
      }).join("");
    }

    function toggleCamera() {
      const btn = document.getElementById("camBtn");
      if (!isScanning) {
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          (decodedText) => {
            html5QrCode.pause();
            executeCheckIn(decodedText);
            setTimeout(() => { if (isScanning) html5QrCode.resume(); }, 2500);
          },
          () => {}
        ).then(() => {
          isScanning = true;
          btn.innerText = "🛑 關閉相機";
          btn.style.background = "#ef4444";
          btn.style.color = "#fff";
        }).catch(() => {
          alert("無法開啟相機，請允許瀏覽器的相機使用權限。");
        });
      } else {
        html5QrCode.stop().then(() => {
          isScanning = false;
          btn.innerText = "📷 開啟相機掃描 QR Code";
          btn.style.background = "#f59e0b";
          btn.style.color = "#0f172a";
        });
      }
    }

    document.getElementById("manualCheckForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const code = document.getElementById("manualCode").value;
      executeCheckIn(code);
      document.getElementById("manualCode").value = "";
    });

    function executeCheckIn(code) {
      const resBox = document.getElementById("checkResult");
      resBox.style.display = "block";
      resBox.className = "result-box";
      resBox.style.background = "#334155";
      resBox.style.color = "#fff";
      resBox.innerText = `正在驗證序號 ${code}...`;

      callApi({ action: "checkin", code: code })
        .then(data => {
          if (data.status === "success") resBox.className = "result-box res-success";
          else if (data.status === "warning") resBox.className = "result-box res-warning";
          else resBox.className = "result-box res-error";
          resBox.innerText = data.message;
          loadAdminData(); // 簽到完成後自動同步更新儀表板與名單狀態
        })
        .catch(() => {
          resBox.className = "result-box res-error";
          resBox.innerText = "⚠️ 網路連線失敗，請重試";
        });
    }
  </script>
</body>
</html>
